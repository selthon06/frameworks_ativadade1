<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selthon</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container">
  <form id="contact-form" novalidate>
    <h2>Contact Us</h2>

    <div class="field-group">
      <div class="field">
        <label for="first-name">First Name *</label>
        <input type="text" id="first-name" name="firstName" />
        <span class="error-msg" id="first-name-error">This field is required</span>
      </div>
      <div class="field">
        <label for="last-name">Last Name *</label>
        <input type="text" id="last-name" name="lastName" />
        <span class="error-msg" id="last-name-error">This field is required</span>
      </div>
    </div>

    <div class="field">
      <label for="email">Email Address *</label>
      <input type="email" id="email" name="email" />
      <span class="error-msg" id="email-error">Please enter a valid email address</span>
    </div>

    <fieldset class="field">
      <legend>Query Type *</legend>
      <div class="radio-group">
        <label class="radio-card">
          <input type="radio" name="queryType" value="general" />
          General Enquiry
        </label>
        <label class="radio-card">
          <input type="radio" name="queryType" value="support" />
          Support Request
        </label>
      </div>
      <span class="error-msg" id="query-type-error">Please select a query type</span>
    </fieldset>

    <div class="field">
      <label for="message">Message *</label>
      <textarea id="message" name="message" rows="4"></textarea>
      <span class="error-msg" id="message-error">This field is required</span>
    </div>

    <div class="field checkbox-field">
      <label for="consent">
        <input type="checkbox" id="consent" name="consent" />
        I consent to being contacted by the team *
      </label>
      <span class="error-msg" id="consent-error">To submit this form, please consent to being contacted</span>
    </div>

    <button type="submit">Submit</button>
  </form>

  <div id="success-toast" class="toast hidden" role="alert">
    <strong>Message Sent!</strong>
    <p>Thanks for completing the form. We'll be in touch soon!</p>
  </div>
</main>
</body>
</html>
