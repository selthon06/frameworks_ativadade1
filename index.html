<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <title>Frontend Mentor | Contact Form</title>
  <link rel="stylesheet" href="style.css">
  <!-- Atributo defer adicionado para carregar o JS com segurança -->
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <form id="contact-form" novalidate>
      <!-- Título alterado para h1 por questões de acessibilidade -->
      <h1>Contact Us</h1>

      <div class="field-group">
        <div class="field">
          <label for="first-name">First Name <span class="required">*</span></label>
          <input type="text" id="first-name" name="firstName" />
          <span class="error-msg" id="first-name-error">This field is required</span>
        </div>
        <div class="field">
          <label for="last-name">Last Name <span class="required">*</span></label>
          <input type="text" id="last-name" name="lastName" />
          <span class="error-msg" id="last-name-error">This field is required</span>
        </div>
      </div>

      <div class="field">
        <label for="email">Email Address <span class="required">*</span></label>
        <input type="email" id="email" name="email" />
        <span class="error-msg" id="email-error">Please enter a valid email address</span>
      </div>

      <fieldset class="field">
        <legend>Query Type <span class="required">*</span></legend>
        <div class="radio-group">
          <label class="radio-card">
            <input type="radio" name="queryType" value="general" />
            General Enquiry
          </label>
          <label class="radio-card">
            <input type="radio" name="queryType" value="support" />
            Support Request
          </label>
        </div>
        <span class="error-msg" id="query-type-error">Please select a query type</span>
      </fieldset>

      <div class="field">
        <label for="message">Message <span class="required">*</span></label>
        <textarea id="message" name="message" rows="4"></textarea>
        <span class="error-msg" id="message-error">This field is required</span>
      </div>

      <div class="field checkbox-field">
        <div class="checkbox-wrapper">
          <input type="checkbox" id="consent" name="consent" />
          <label for="consent">I consent to being contacted by the team <span class="required">*</span></label>
        </div>
        <span class="error-msg" id="consent-error">To submit this form, please consent to being contacted</span>
      </div>

      <button type="submit">Submit</button>
    </form>

    <div id="success-toast" class="toast hidden" role="alert" aria-live="polite">
      <div class="toast-header">
        <img src="./assets/images/icon-success-check.svg" alt="" aria-hidden="true">
        <strong>Message Sent!</strong>
      </div>
      <p>Thanks for completing the form. We'll be in touch soon!</p>
    </div>
  </main>
</body>
</html>
